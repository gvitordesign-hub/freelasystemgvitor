name: Gerar APK Android

# Manual: GitHub > Actions > "Gerar APK Android" > Run workflow.
# O app abre o site da VPS (mobile/capacitor.config.json), então NÃO precisa de secrets nem de build do site:
# só é preciso gerar um novo APK se mudar ícone, nome, permissões ou o endereço do site.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          npm run sync

      - name: Build APK (debug, instalável)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GVITOR-SYSTEM-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
