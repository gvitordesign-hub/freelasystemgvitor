<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>GVITOR SYSTEM</title>
  <style>
    html,body{margin:0;height:100%;background:#020617;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
    .logo{width:72px;height:72px;border-radius:18px;background:#a855f7}
    h1{font-size:20px;margin:6px 0 0}
    p{margin:0;color:#94a3b8;font-size:15px;line-height:1.4;max-width:300px}
    button{margin-top:10px;min-height:48px;padding:0 28px;border:0;border-radius:14px;background:#fff;color:#020617;font-size:15px;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true"></div>
    <h1>Sem conexão</h1>
    <p>Não foi possível abrir o sistema. Verifique a internet e tente de novo.</p>
    <button onclick="location.href='https://sistema.gvitor.com.br'">Tentar de novo</button>
  </main>
</body>
</html>
