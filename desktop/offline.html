<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>GVITOR SYSTEM</title>
  <style>
    html,body{margin:0;height:100%;background:#020617;color:#f8fafc;font-family:"Segoe UI",system-ui,sans-serif}
    main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
    .logo{width:72px;height:72px;border-radius:18px;background:#a855f7}
    h1{font-size:22px;margin:6px 0 0}
    p{margin:0;color:#94a3b8;font-size:15px;max-width:340px;line-height:1.4}
    button{margin-top:10px;min-height:44px;padding:0 28px;border:0;border-radius:12px;background:#fff;color:#020617;font-size:15px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="logo"></div>
    <h1>Sem conexão</h1>
    <p>Não foi possível abrir o sistema. Verifique a internet e tente de novo.</p>
    <button onclick="location.href='https://sistema.gvitor.com.br'">Tentar de novo</button>
  </main>
</body>
</html>
